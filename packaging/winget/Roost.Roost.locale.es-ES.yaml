ShortDescription: Entorno de desarrollo PHP local (PHP, MariaDB/MySQL, nginx y sitios https://*.test) que te avisa de lo que está fuera de soporte o tiene CVE.
Description: |-
  Roost instala PHP, MariaDB y MySQL oficiales, cada versión en su carpeta; sirve cada proyecto en https://<nombre>.test con nginx y una CA local, y en la terminal usa el PHP que toca en cada carpeta.
  Además audita todos los PHP, MySQL y MariaDB de la máquina (Roost, Laragon, XAMPP, WAMP, Herd, Scoop...) contra un dataset de avisos y fechas de fin de soporte que lleva dentro, con códigos de salida para la CI.
  El paquete trae la CLI roost y la app de escritorio Roost (roost-desktop), con icono en la bandeja.
