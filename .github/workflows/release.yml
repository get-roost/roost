# Publica una versión de Roost en GitHub Releases.
#
# Se dispara al subir una etiqueta v<versión> (v0.1.0; con guion, como v0.2.0-beta.1, sale como
# prerelease), que tiene que coincidir con <Version> de Directory.Build.props. A mano
# (workflow_dispatch) hace todo menos publicar: deja lo que saldría en el artefacto
# «release-preview».
#
# Assets: roost-<versión>-win-x64-setup.exe (el instalador de Windows: Program Files, accesos
# directos y, si se elige, el PATH; build/roost.iss), roost-<versión>-win-x64.zip (lo mismo sin
# instalar: CLI, helper, shim y app, autocontenidos y en la raíz del zip),
# roost-<versión>-linux-x64.tar.gz (solo la CLI, un ejecutable) y SHA256SUMS.txt.
#
# Firma (opcional; sin configurar, la release sale sin firmar y las notas lo dicen):
#   - Azure Artifact Signing (antes Trusted Signing), con OIDC: variables AZURE_SIGNING_ENDPOINT,
#     AZURE_SIGNING_ACCOUNT y AZURE_CERTIFICATE_PROFILE, y secretos AZURE_CLIENT_ID,
#     AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID.
#   - SignPath (gratis para open source con SignPath Foundation): variable
#     SIGNPATH_ORGANIZATION_ID (y, si no valen los de por defecto, SIGNPATH_PROJECT_SLUG,
#     SIGNPATH_SIGNING_POLICY_SLUG y SIGNPATH_ARTIFACT_CONFIGURATION_SLUG) y secreto
#     SIGNPATH_API_TOKEN. La configuración de artefacto está en .github/signpath/.
# Si están las dos, se usa Azure. Ver «Publicar una versión» en el README.
# El instalador y su desinstalador (unins000.exe) se compilan DESPUÉS de firmar los exe de dentro, así
# que los firma el propio ISCC con build/sign.ps1 (mismo método: signtool + la dlib de Azure, o una
# solicitud de SignPath por fichero, que con SignPath necesita además una configuración de artefacto de
# un solo PE, SIGNPATH_PE_ARTIFACT_CONFIGURATION_SLUG). Sin firma configurada, el instalador compila
# exactamente igual que antes.
# El instalador lleva dentro el Visual C++ Redistributable x64 (descargado de Microsoft y con su firma
# comprobada aquí), que instala en silencio solo si falta o es anterior al 14.50.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      firmar:
        description: Firmar también en la prueba (gasta una firma; con SignPath, pide aprobarla)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión y compararla con la etiqueta
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=Directory.Build.props::<Version> no es una version semver valida: '$version'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con <Version>$version</Version> de Directory.Build.props: sube la version o borra la etiqueta"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Roost $version (prerelease: $prerelease)"

  test:
    name: Build y tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Roost.slnx -c Release
      - name: Tests
        run: dotnet test Roost.slnx -c Release --no-build

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write   # OIDC para Azure
      actions: read     # SignPath lee el artefacto sin firmar
    outputs:
      firma: ${{ steps.firma.outputs.metodo }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      STAGE: artifacts/win-x64   # lo que va en el zip (firmado, si toca)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Los cuatro exe en una carpeta con un solo runtime; el shim, con NativeAOT. Ver el script.
      - name: Publicar
        shell: pwsh
        run: ./build/publish-windows.ps1 -Output artifacts/win-x64

      - name: Elegir la firma
        id: firma
        shell: pwsh
        env:
          QUIERE_FIRMAR: ${{ github.event_name == 'push' || inputs.firmar }}
          AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $metodo = 'no'
          if ($env:QUIERE_FIRMAR -eq 'true') {
            if ($env:AZURE_ENDPOINT) { $metodo = 'azure' }
            elseif ($env:SIGNPATH_ORG -and $env:SIGNPATH_TOKEN) { $metodo = 'signpath' }
          }
          "metodo=$metodo" >> $env:GITHUB_OUTPUT
          $files = Get-Content artifacts/win-x64.firmar.txt
          "files=$($files -join ',')" >> $env:GITHUB_OUTPUT
          Write-Host "Firma: $metodo"

      # --- Azure Artifact Signing: firma en el sitio los exe y dll propios (no los de terceros).
      - name: Azure login (OIDC)
        if: steps.firma.outputs.metodo == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Firmar con Azure Artifact Signing
        if: steps.firma.outputs.metodo == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ steps.firma.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Roost
          description-url: https://github.com/${{ github.repository }}

      # --- SignPath: sube la carpeta como artefacto, SignPath firma lo que dice la configuración
      # de artefacto (.github/signpath/artifact-configuration.xml) y devuelve la carpeta firmada.
      - name: Subir sin firmar para SignPath
        if: steps.firma.outputs.metodo == 'signpath'
        id: sin-firmar
        uses: actions/upload-artifact@v7
        with:
          name: roost-win-x64-sin-firmar
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 1

      - name: Firmar con SignPath
        if: steps.firma.outputs.metodo == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'roost' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          # Con SignPath Foundation, cada firma la aprueba una persona: hay que darle tiempo.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/win-x64-firmado

      - name: Usar la carpeta firmada
        if: steps.firma.outputs.metodo == 'signpath'
        shell: pwsh
        run: |
          Remove-Item $env:STAGE -Recurse -Force
          Move-Item artifacts/win-x64-firmado $env:STAGE

      - name: Comprobar las firmas
        if: steps.firma.outputs.metodo != 'no'
        shell: pwsh
        run: |
          $mal = Get-Content artifacts/win-x64.firmar.txt | Where-Object { (Get-AuthenticodeSignature $_).Status -ne 'Valid' }
          if ($mal) { throw "Sin firma valida: $($mal -join ', ')" }
          Write-Host "Firmas validas en $env:STAGE"

      - name: Probar lo publicado
        shell: pwsh
        run: |
          $env:ROOST_HOME = Join-Path $env:RUNNER_TEMP 'roost-home'
          New-Item -ItemType Directory -Force $env:ROOST_HOME | Out-Null
          $roost = Join-Path $env:STAGE 'roost.exe'
          $v = & $roost --version
          if ($v -ne $env:VERSION) { throw "roost --version da '$v' y la version es $env:VERSION" }
          & $roost scan
          if ($LASTEXITCODE -ne 0) { throw "roost scan ha fallado (codigo $($LASTEXITCODE))" }
          & $roost audit --json | Out-Null
          # 0 = nada bloqueante, 1 = hay algo vulnerable en el runner; 2 = no carga el dataset.
          if ($LASTEXITCODE -gt 1) { throw "roost audit ha salido con $($LASTEXITCODE): no carga el dataset" }
          # El shim (NativeAOT) arranca y, sin ningun PHP de Roost, lo dice.
          $shims = Join-Path $env:ROOST_HOME 'bin\shims'
          New-Item -ItemType Directory -Force $shims | Out-Null
          Copy-Item (Join-Path $env:STAGE 'roost-shim.exe') (Join-Path $shims 'php.exe')
          $err = Join-Path $env:RUNNER_TEMP 'shim.err'
          $p = Start-Process (Join-Path $shims 'php.exe') -ArgumentList '-v' -Wait -PassThru -NoNewWindow -RedirectStandardError $err
          if ($p.ExitCode -ne 1 -or -not (Select-String -Path $err -Pattern 'roost php install' -Quiet)) {
            throw "El shim no arranca bien (codigo $($p.ExitCode)): $(Get-Content $err -Raw)"
          }
          exit 0

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/dist | Out-Null
          $zip = Join-Path $PWD "artifacts/dist/roost-$env:VERSION-win-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $env:STAGE).Path, $zip, 'Optimal', $false)
          Get-Item $zip | Format-Table Name, Length

      # El VC++ Redistributable que el instalador pone si falta (PHP, MariaDB, MySQL y Apache lo
      # necesitan): de Microsoft, y con su firma comprobada antes de meterlo en el setup.
      - name: Visual C++ Redistributable
        id: vcredist
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'artifacts/vcredist'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir 'vc_redist.x64.exe'
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $exe -MaximumRetryCount 3 -RetryIntervalSec 5
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid') { throw "vc_redist.x64.exe no lleva una firma valida ($($sig.Status))" }
          if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "vc_redist.x64.exe no lo firma Microsoft: $($sig.SignerCertificate.Subject)" }
          Write-Host "vc_redist.x64.exe $((Get-Item $exe).VersionInfo.ProductVersion), firmado por $($sig.SignerCertificate.Subject)"
          "path=$exe" >> $env:GITHUB_OUTPUT

      # Lo que necesita build/sign.ps1 para firmar el setup y el desinstalador desde ISCC.
      - name: Preparar la firma del instalador
        if: steps.firma.outputs.metodo != 'no'
        shell: pwsh
        env:
          METODO: ${{ steps.firma.outputs.metodo }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: ./build/sign.ps1 -Method $env:METODO -Work artifacts/signing -Prepare

      # El instalador (Inno Setup, build/roost.iss), con lo mismo que lleva el zip, el VC++ dentro y,
      # si hay firma, el setup y el desinstalador firmados por ISCC (/S + SignTool=).
      - name: Instalador
        shell: pwsh
        env:
          METODO: ${{ steps.firma.outputs.metodo }}
          VCREDIST: ${{ steps.vcredist.outputs.path }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_PE_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_PE_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }
          }
          $numeric = $env:VERSION -replace '-.*$', ''
          $source = (Resolve-Path $env:STAGE).Path
          $out = (Resolve-Path artifacts/dist).Path
          $args = @('/Q', "/DAppVersion=$env:VERSION", "/DNumericVersion=$numeric", "/DSourceDir=$source", "/DOutputDir=$out", "/DVcRedist=$env:VCREDIST")
          if ($env:METODO -ne 'no') {
            # ISCC ejecuta la orden por cada fichero que firma: $f es el fichero (entre comillas) y $q una comilla.
            $script = (Resolve-Path build/sign.ps1).Path
            $work = (Resolve-Path artifacts/signing).Path
            $args += "/Ssign=pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `$q$script`$q -Method $env:METODO -Work `$q$work`$q -File `$f"
            $args += '/DSignTool=sign'
          }
          & $iscc @args build/roost.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha fallado (codigo $LASTEXITCODE)" }
          Get-Item artifacts/dist/*-setup.exe | Format-Table Name, Length

      - name: Comprobar la firma del instalador
        if: steps.firma.outputs.metodo != 'no'
        shell: pwsh
        run: |
          $setup = (Get-Item "artifacts/dist/roost-$env:VERSION-win-x64-setup.exe").FullName
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne 'Valid') { throw "El instalador no lleva una firma valida ($($sig.Status))" }
          Write-Host "Instalador firmado por $($sig.SignerCertificate.Subject)"

      # Se instala en silencio en el runner, se prueba y se desinstala: que no salga un instalador roto.
      - name: Probar el instalador
        shell: pwsh
        env:
          METODO: ${{ steps.firma.outputs.metodo }}
        run: |
          $setup = (Get-Item "artifacts/dist/roost-$env:VERSION-win-x64-setup.exe").FullName
          $dir = Join-Path $env:RUNNER_TEMP 'RoostInstalado'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", '/TASKS=addtopath', "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "El instalador ha salido con $($p.ExitCode)" }
          foreach ($f in 'roost.exe', 'roost-desktop.exe', 'roost-helper.exe', 'roost-shim.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Falta $f en la instalacion" }
          }
          $v = & (Join-Path $dir 'roost.exe') --version
          if ($v -ne $env:VERSION) { throw "roost --version, instalado, da '$v' y la version es $env:VERSION" }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';' -contains $dir)) {
            throw "El instalador no ha puesto $dir en el PATH del sistema"
          }
          # El VC++ lo trae el runner: el instalador lo ha visto y no lo ha vuelto a instalar.
          $vc = Select-String -Path $log -Pattern 'vc_redist' | ForEach-Object Line
          if ($vc) { Write-Host "vc_redist en el log: $vc" } else { Write-Host 'vc_redist: no hacia falta (ya estaba)' }
          if ($env:METODO -ne 'no') {
            $sig = Get-AuthenticodeSignature (Join-Path $dir 'unins000.exe')
            if ($sig.Status -ne 'Valid') { throw "El desinstalador unins000.exe no lleva una firma valida ($($sig.Status))" }
            Write-Host "Desinstalador firmado por $($sig.SignerCertificate.Subject)"
          }
          if (Get-Process roost-desktop -ErrorAction SilentlyContinue) { throw 'Un /VERYSILENT sin /ROOSTRELAUNCH no deberia abrir la app' }
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "El desinstalador ha salido con $($u.ExitCode)" }
          # El desinstalador se copia a %TEMP% y termina de borrar desde ahi: se espera a que acabe.
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'roost.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'roost.exe')) { throw "El desinstalador ha dejado roost.exe" }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';' -contains $dir) {
            throw "El desinstalador no ha quitado $dir del PATH"
          }
          Write-Host "Instalador probado: instala, roost --version $v, PATH del sistema, desinstala y lo quita."

      # Actualizar encima de la última publicada, como lo hace la app: se instala la 0.1.2 desde su
      # release, se dejan datos en C:\roost, se instala encima la nueva en silencio y se comprueba que
      # queda la nueva, que los datos siguen y que la app vuelve (/ROOSTRELAUNCH=1). La 0.1.2 no
      # relanzaba nada en silencioso (skipifsilent): el relanzamiento que se prueba es el de ESTE setup.
      - name: Probar actualizar encima de la 0.1.2
        shell: pwsh
        env:
          ANTERIOR: '0.1.2'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'RoostActualizado'
          $tmp = Join-Path $env:RUNNER_TEMP 'anterior'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:ANTERIOR"
          $old = Join-Path $tmp "roost-$env:ANTERIOR-win-x64-setup.exe"
          Invoke-WebRequest "$base/roost-$env:ANTERIOR-win-x64-setup.exe" -OutFile $old -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile (Join-Path $tmp 'SHA256SUMS.txt') -MaximumRetryCount 3 -RetryIntervalSec 5
          $linea = Select-String -Path (Join-Path $tmp 'SHA256SUMS.txt') -Pattern "^([0-9a-fA-F]{64})\s+\*?roost-$env:ANTERIOR-win-x64-setup\.exe\s*$"
          if (-not $linea) { throw "El SHA256SUMS.txt de la $env:ANTERIOR no trae su setup" }
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLower() -ne $linea.Matches[0].Groups[1].Value.ToLower()) { throw "El setup de la $env:ANTERIOR no cuadra con su SHA256SUMS.txt" }

          # 1. La anterior, instalada como la instalaria un usuario.
          $p = Start-Process $old -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador de la $env:ANTERIOR ha salido con $($p.ExitCode)" }
          $v = & (Join-Path $dir 'roost.exe') --version
          if ($v -ne $env:ANTERIOR) { throw "Tras instalar la anterior, roost --version da '$v'" }

          # 2. Datos del usuario que no se pueden perder: en C:\roost, la raiz de verdad.
          New-Item -ItemType Directory -Force 'C:\roost\www\marcador', 'C:\roost\state' | Out-Null
          '<?php echo "esto estaba antes de actualizar";' | Set-Content 'C:\roost\www\marcador\index.php' -Encoding ascii
          '{ "marcador": true }' | Set-Content 'C:\roost\state\marcador.json' -Encoding ascii
          $antesWww = (Get-FileHash 'C:\roost\www\marcador\index.php').Hash
          $antesState = (Get-FileHash 'C:\roost\state\marcador.json').Hash

          # 3. La nueva encima, con la misma linea que usa la app (UpdateInstaller.SetupArguments).
          $setup = (Get-Item "artifacts/dist/roost-$env:VERSION-win-x64-setup.exe").FullName
          $log = Join-Path $env:RUNNER_TEMP 'actualizar.log'
          $p = Start-Process $setup -ArgumentList '/SILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CLOSEAPPLICATIONS', '/ROOSTRELAUNCH=1', "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Actualizar encima ha salido con $($p.ExitCode)" }
          $v = & (Join-Path $dir 'roost.exe') --version
          if ($v -ne $env:VERSION) { throw "Tras actualizar, roost --version da '$v' y la version es $env:VERSION" }
          foreach ($f in 'roost.exe', 'roost-desktop.exe', 'roost-helper.exe', 'roost-shim.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Falta $f tras actualizar" }
          }
          if ((Get-FileHash 'C:\roost\www\marcador\index.php').Hash -ne $antesWww) { throw 'Actualizar ha tocado C:\roost\www' }
          if ((Get-FileHash 'C:\roost\state\marcador.json').Hash -ne $antesState) { throw 'Actualizar ha tocado C:\roost\state' }

          # 4. Con /ROOSTRELAUNCH=1, el instalador vuelve a abrir la app con --updated como el usuario original.
          $app = $null
          for ($i = 0; $i -lt 30 -and -not $app; $i++) { Start-Sleep -Seconds 1; $app = Get-Process roost-desktop -ErrorAction SilentlyContinue }
          if (-not $app) { Get-Content $log -Tail 40; throw 'El instalador no ha vuelto a abrir roost-desktop.exe tras actualizar en silencio' }
          $cmd = (Get-CimInstance Win32_Process -Filter "name = 'roost-desktop.exe'" | Select-Object -First 1).CommandLine
          Write-Host "La app ha vuelto: $cmd"
          if ($cmd -notmatch '--updated') { throw "La app no ha vuelto con --updated: $cmd" }
          Stop-Process -Name roost-desktop -Force
          Start-Sleep -Seconds 3

          # 5. Desinstalar tampoco toca los datos.
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "El desinstalador ha salido con $($u.ExitCode)" }
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'roost.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'roost.exe')) { throw 'El desinstalador ha dejado roost.exe' }
          if (-not (Test-Path 'C:\roost\www\marcador\index.php')) { throw 'Desinstalar ha borrado C:\roost\www' }
          Write-Host "Actualizar encima probado: $env:ANTERIOR -> $env:VERSION, datos de C:\roost intactos, la app vuelve con --updated."

      - uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: |
            artifacts/dist/*.zip
            artifacts/dist/*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publicar
        run: bash build/publish-linux.sh artifacts/linux-x64

      - name: Probar lo publicado
        run: |
          export ROOST_HOME="$RUNNER_TEMP/roost-home"
          mkdir -p "$ROOST_HOME"
          roost=artifacts/linux-x64/roost
          v="$("$roost" --version)"
          if [ "$v" != "$VERSION" ]; then echo "::error::roost --version da '$v' y la version es $VERSION"; exit 1; fi
          "$roost" scan
          code=0
          "$roost" audit --json > /dev/null || code=$?
          # 0 = nada bloqueante, 1 = hay algo vulnerable en el runner; 2 = no carga el dataset.
          if [ "$code" -gt 1 ]; then echo "::error::roost audit ha salido con $code: no carga el dataset"; exit 1; fi

      - name: Empaquetar
        run: |
          mkdir -p artifacts/dist
          tarball="artifacts/dist/roost-$VERSION-linux-x64.tar"
          # Los permisos, explícitos: roost ejecutable aunque se empaquete desde otro sistema de ficheros.
          common=(-C artifacts/linux-x64 --owner=0 --group=0 --numeric-owner)
          tar "${common[@]}" --mode=0755 -cf "$tarball" roost
          tar "${common[@]}" --mode=0644 -rf "$tarball" LICENSE.txt
          gzip -9n "$tarball"
          # A una variable: con pipefail, un grep -q en tubería corta a tar (SIGPIPE) y falla.
          listing="$(tar -tvzf "$tarball.gz")"
          echo "$listing"
          grep -qE '^-rwxr-xr-x .* roost$' <<< "$listing" || { echo "::error::roost no es ejecutable en el tar.gz"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-x64
          path: artifacts/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [version, test, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # crear la release
      id-token: write       # attestations
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      FIRMA: ${{ needs.windows.outputs.firma }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          # --text: «<sha256>  <fichero>», con dos espacios (el formato de sha256sum -c).
          sha256sum --text roost-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Notas
        run: |
          case "$FIRMA" in
            azure) firma="El instalador, el desinstalador y los ejecutables y las dll de Roost van firmados con Azure Artifact Signing." ;;
            signpath) firma="El instalador, el desinstalador y los ejecutables y las dll de Roost van firmados. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)." ;;
            *) firma="**Esta versión no va firmada.** Al abrirla, Windows SmartScreen puede avisar de que es de un editor desconocido («Más información» y «Ejecutar de todas formas»). Comprueba la descarga con SHA256SUMS.txt: la app y \`roost update --install\` lo hacen solos." ;;
          esac
          {
            echo "## Descargas"
            echo
            echo "| Fichero | Qué lleva |"
            echo "|---|---|"
            echo "| **roost-$VERSION-win-x64-setup.exe** | **Windows 10/11 x64, el instalador (recomendado).** Instala Roost en Program Files con su acceso directo, el Visual C++ Redistributable si falta y, si lo eliges, añade roost a la línea de comandos. Para actualizar, la app lo hace sola (el aviso de versión nueva → «Actualizar ahora», o \`roost update --install\`); también puedes ejecutar el nuevo a mano. Tus datos y tus sitios no se tocan. |"
            echo "| roost-$VERSION-win-x64.zip | Windows 10/11 x64, sin instalar: la app (roost-desktop.exe), la CLI (roost.exe), roost-helper.exe y el shim de php. No necesita .NET: descomprime y abre roost-desktop.exe. Es lo que usa Scoop (\`scoop bucket add roost https://github.com/$GITHUB_REPOSITORY\` y \`scoop install roost\`). |"
            echo "| roost-$VERSION-linux-x64.tar.gz | Linux x64: la CLI (roost), un solo ejecutable. De momento, roost scan y roost audit. |"
            echo "| SHA256SUMS.txt | Las sumas SHA-256 de lo anterior (\`sha256sum -c SHA256SUMS.txt\`). |"
            echo
            echo "## Firma y procedencia"
            echo
            echo "$firma"
            echo
            echo "Cada fichero lleva una attestation de GitHub que dice de qué commit y de qué workflow ha salido: \`gh attestation verify roost-$VERSION-win-x64.zip -R $GITHUB_REPOSITORY\`."
            echo
          } > notes.md
          cat notes.md

      - name: Guardar lo que se publicaria (prueba)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-preview
          path: |
            dist/
            notes.md

      - name: Attestations de procedencia
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/roost-*

      - name: Crear la release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Roost $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
